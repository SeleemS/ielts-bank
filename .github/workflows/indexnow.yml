# Ping IndexNow (Bing / Copilot / Yandex / Naver / Seznam) with the URLs that
# changed, after every successful Vercel PRODUCTION deploy.
#
# Vercel's GitHub integration posts a deployment_status event for each deploy;
# this job runs only for successful Production ones. Two sources of "changed":
#   * the files in the deployed commit (blog posts, static pages, redirects)
#   * sitemap URLs whose <lastmod> is today or yesterday (database content
#     such as new passages, which never shows up in git)
# No secrets needed: the IndexNow key is public by design (public/<key>.txt).
# Details: docs/growth-2026-09-23/30-TECH-SEO-CHANGES.md
name: IndexNow ping

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  indexnow:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # deployment_status has no push `before`, and HEAD~1..HEAD misses every
      # commit but the last when one deploy ships several (a fast-forward of a
      # multi-commit branch). Diff against the commit of the previous successful
      # Production deployment instead; fall back to the first parent (for a
      # merge commit that is the full merged change) if none is found or it is
      # not an ancestor (e.g. after a rollback).
      - name: Find the previously deployed commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ID: ${{ github.event.deployment.id }}
          CURRENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          base=""
          seen_current=""
          rows=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=50" \
            --jq '.[] | "\(.id) \(.sha)"' || true)
          while read -r id sha; do
            [ -z "$id" ] && continue
            if [ "$id" = "$CURRENT_ID" ]; then seen_current=1; continue; fi
            [ -z "$seen_current" ] && continue
            [ "$sha" = "$CURRENT_SHA" ] && continue
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""' || true)
            if [ "$state" = "success" ] || [ "$state" = "inactive" ]; then base="$sha"; break; fi
          done <<< "$rows"
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$CURRENT_SHA" 2>/dev/null; then
            base=$(git rev-parse "${CURRENT_SHA}^1")
          fi
          echo "Diffing ${base}..${CURRENT_SHA}"
          echo "range=${base}..${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Submit changed URLs
        run: node scripts/seo/indexnow-submit.mjs --git-range "${{ steps.base.outputs.range }}" --since yesterday
